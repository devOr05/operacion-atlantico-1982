<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c2612" />
      <stop offset="70%" stop-color="#06160a" />
      <stop offset="100%" stop-color="#020803" />
    </radialGradient>
    <radialGradient id="sweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(85, 255, 119, 0.45)" />
      <stop offset="100%" stop-color="rgba(85, 255, 119, 0)" />
    </radialGradient>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo sólido oscuro -->
  <rect width="512" height="512" fill="#030804" rx="48" />

  <g filter="url(#greenGlow)">
    <!-- Marco Exterior del Radar Centrado -->
    <circle cx="256" cy="256" r="215" fill="url(#radarBg)" stroke="#39b54a" stroke-width="7" />
    
    <!-- Anillos Concéntricos de Distancia Táctica -->
    <circle cx="256" cy="256" r="162" fill="none" stroke="#237a32" stroke-width="2.5" stroke-dasharray="8 6" />
    <circle cx="256" cy="256" r="108" fill="none" stroke="#237a32" stroke-width="2.5" />
    <circle cx="256" cy="256" r="54" fill="none" stroke="#237a32" stroke-width="2" stroke-dasharray="4 4" />
    
    <!-- Retícula / Ejes Cruzados centrados en (256, 256) -->
    <line x1="41" y1="256" x2="471" y2="256" stroke="#237a32" stroke-width="2" />
    <line x1="256" y1="41" x2="256" y2="471" stroke="#237a32" stroke-width="2" />
    
    <!-- Diagonales a 45 grados -->
    <line x1="104" y1="104" x2="408" y2="408" stroke="#164d20" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="104" y1="408" x2="408" y2="104" stroke="#164d20" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Marcas de Grados / Ticks Perimetrales -->
    <circle cx="256" cy="256" r="206" fill="none" stroke="#55ff77" stroke-width="2" stroke-dasharray="2 12" />

    <!-- Silueta Vectorial de las Islas Malvinas Centrada -->
    <!-- Gran Malvina (Oeste) -->
    <path d="M 180 205 Q 195 185 212 195 T 220 235 T 202 280 T 172 270 T 162 232 Z" fill="none" stroke="#55ff77" stroke-width="3" opacity="0.9" />
    <!-- Isla Soledad (Este) -->
    <path d="M 268 200 Q 302 190 322 215 T 312 255 T 292 290 T 258 270 T 254 235 Z" fill="none" stroke="#55ff77" stroke-width="3" opacity="0.9" />
    <!-- Estrecho de San Carlos -->
    <line x1="230" y1="185" x2="248" y2="285" stroke="#39b54a" stroke-width="1.5" stroke-dasharray="2 4" />

    <!-- Eco Radar Hostil (Rojo) -->
    <circle cx="335" cy="188" r="7" fill="#ff4444" />
    <circle cx="335" cy="188" r="14" fill="none" stroke="#ff4444" stroke-width="2" opacity="0.75" />
    
    <!-- Patrullas Amigas (Verde Fósforo) -->
    <circle cx="190" cy="242" r="6" fill="#55ff77" />
    <circle cx="285" cy="235" r="6" fill="#55ff77" />

    <!-- Haz de Barrido Radar en Rotación (Noreste) -->
    <path d="M 256 256 L 408 104 A 215 215 0 0 0 256 41 Z" fill="url(#sweepGrad)" opacity="0.85" />
    <line x1="256" y1="256" x2="408" y2="104" stroke="#aaffbb" stroke-width="3.5" />

    <!-- Clavija / Punto Central Exacto -->
    <circle cx="256" cy="256" r="7" fill="#55ff77" />
  </g>
</svg>
