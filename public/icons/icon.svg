<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2a14" />
      <stop offset="85%" stop-color="#061309" />
      <stop offset="100%" stop-color="#020703" />
    </radialGradient>
    <radialGradient id="sweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(85, 255, 119, 0.4)" />
      <stop offset="100%" stop-color="rgba(85, 255, 119, 0)" />
    </radialGradient>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Background for Android Maskable Support -->
  <rect width="512" height="512" fill="#040805" />

  <g filter="url(#greenGlow)">
    <!-- Radar Outer Frame -->
    <circle cx="256" cy="240" r="215" fill="url(#radarBg)" stroke="#39b54a" stroke-width="7" />
    
    <!-- Concentric Distance Rings -->
    <circle cx="256" cy="240" r="160" fill="none" stroke="#237a32" stroke-width="2.5" stroke-dasharray="8 6" />
    <circle cx="256" cy="240" r="105" fill="none" stroke="#237a32" stroke-width="2.5" />
    <circle cx="256" cy="240" r="50" fill="none" stroke="#237a32" stroke-width="2" stroke-dasharray="4 4" />
    
    <!-- Crosshairs -->
    <line x1="45" y1="240" x2="467" y2="240" stroke="#237a32" stroke-width="2" />
    <line x1="256" y1="29" x2="256" y2="451" stroke="#237a32" stroke-width="2" />
    
    <!-- Degree Ticks -->
    <circle cx="256" cy="240" r="205" fill="none" stroke="#55ff77" stroke-width="2" stroke-dasharray="2 12" />

    <!-- Vector Silhouette of Malvinas -->
    <path d="M 175 190 Q 190 170 210 180 T 220 220 T 200 270 T 165 260 T 155 220 Z" fill="none" stroke="#55ff77" stroke-width="3" opacity="0.9" />
    <path d="M 275 185 Q 315 175 335 200 T 325 240 T 305 280 T 265 260 T 260 220 Z" fill="none" stroke="#55ff77" stroke-width="3" opacity="0.9" />
    <line x1="230" y1="170" x2="250" y2="270" stroke="#39b54a" stroke-width="1.5" stroke-dasharray="2 4" />

    <!-- Hostile Blip -->
    <circle cx="345" cy="170" r="7" fill="#ff4444" />
    <circle cx="345" cy="170" r="14" fill="none" stroke="#ff4444" stroke-width="2" opacity="0.7" />
    
    <!-- Friendly Patrols -->
    <circle cx="185" cy="230" r="6" fill="#55ff77" />
    <circle cx="295" cy="220" r="6" fill="#55ff77" />

    <!-- Sweep Sector -->
    <path d="M 256 240 L 415 125 A 215 215 0 0 0 256 25 Z" fill="url(#sweepGrad)" opacity="0.8" />
    <line x1="256" y1="240" x2="415" y2="125" stroke="#aaffbb" stroke-width="3.5" />

    <!-- Center Pin -->
    <circle cx="256" cy="240" r="7" fill="#55ff77" />
  </g>

  <!-- Title Bottom -->
  <text x="256" y="490" text-anchor="middle" font-family="'Share Tech Mono', monospace, sans-serif" font-weight="900" font-size="28" fill="#55ff77" letter-spacing="4">HÉROES 1982</text>
</svg>